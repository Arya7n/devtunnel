services:
  postgres:
    image: postgres:16-alpine
    container_name: devtunnel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devtunnel
      POSTGRES_PASSWORD: devtunnel
      POSTGRES_DB: devtunnel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devtunnel -d devtunnel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devtunnel-redis
    restart: unless-stopped
    # Host 6380 avoids clashing with other local Redis containers on 6379
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Caddy / Nginx reverse proxy — wired in Phase 8
  # caddy:
  #   image: caddy:2-alpine
  #   ...

volumes:
  postgres_data:
  redis_data:
